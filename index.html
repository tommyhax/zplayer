<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The whole screen, into the corners under the tablet's status bar (`viewport-fit`),
         and no pinch zoom: the desk scales itself to the window. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>zPlayer</title>
    <!-- Opened from a tablet's home screen, the player gets the whole screen and no browser
         chrome: the manifest's standalone display, and the Apple meta iOS still reads. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="zPlayer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b0c0e" />
    <link rel="apple-touch-icon" href="./icon.png" />
    <link rel="icon" href="./icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
